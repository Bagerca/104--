<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#151515">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hub">
    
    <title>Student Hub</title>
    
    <!-- Open Graph (Telegram, VK, Discord, WhatsApp) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Student Hub">
    <meta property="og:site_name" content="Student Hub">
    <meta property="og:description" content="Удобная платформа для отслеживания расписания, домашних заданий и событий группы.">
    <meta property="og:image" content="icons/icon-512.png">

    <!-- Twitter Card (Twitter, iMessage) -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Student Hub">
    <meta name="twitter:description" content="Удобная платформа для отслеживания расписания, домашних заданий и событий группы.">
    <meta name="twitter:image" content="icons/icon-512.png">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/icon-mobile.svg">

    <link rel="preload" href="data/bells.json" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="data/schedule.json" as="fetch" crossorigin="anonymous">
    <link rel="modulepreload" href="js/app.js">
    <link rel="modulepreload" href="js/router.js">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/views/schedule.css">
    <link rel="stylesheet" href="css/views/group.css">
    <link rel="stylesheet" href="css/views/homework.css">
    <link rel="stylesheet" href="css/views/events.css">
    <link rel="stylesheet" href="css/views/settings.css">
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="app-container">
        <header class="app-header">
            <h1 id="page-title">Расписание</h1>
            <a href="#/settings" class="icon-btn" aria-label="Настройки" id="header-settings-btn">
                <!-- SVG генерируется через js/app.js -->
            </a>
        </header>

        <main id="app-content" class="fade-in">
            <!-- Контент -->
        </main>

        <nav class="bottom-nav glass">
            <!-- Иконки сюда подтянет ThemeManager.js -> getIcon() -->
            <a href="#/schedule" class="nav-item active" data-title="Расписание">
                <svg width="24" height="24" viewBox="0 0 24 24"></svg>
                <span>Уроки</span>
            </a>
            <a href="#/homework" class="nav-item" data-title="Домашка">
                <svg width="24" height="24" viewBox="0 0 24 24"></svg>
                <span>ДЗ</span>
            </a>
            <a href="#/group" class="nav-item" data-title="Группа">
                <svg width="24" height="24" viewBox="0 0 24 24"></svg>
                <span>Группа</span>
            </a>
            <a href="#/events" class="nav-item" data-title="События">
                <svg width="24" height="24" viewBox="0 0 24 24"></svg>
                <span>Ивенты</span>
            </a>
        </nav>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
