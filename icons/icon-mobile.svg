<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Эффект мягкого свечения -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>
  </defs>
  
  <!-- Сплошной темный фон (защита от обрезки) -->
  <rect width="512" height="512" fill="#151515"/>
  
  <!-- Центральное бордовое свечение -->
  <circle cx="256" cy="256" r="160" fill="#93002E" filter="url(#glow)" opacity="0.9"/>
          
  <!-- Минималистичная гигантская цифра 4 -->
  <text x="256" y="390" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="400" 
        fill="#ffffff" 
        text-anchor="middle">4</text>
</svg>